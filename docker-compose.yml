version: "3.8"

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - public_data:/usr/share/nginx/html
      - ./content:/home/wiki/content:ro
    depends_on:
      search-server:
        condition: service_started
    restart: unless-stopped

  search-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    expose:
      - "3000"
    volumes:
      - db_data:/home/wiki/server
      - ./content:/home/wiki/content:ro
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DB_PATH=/home/wiki/server/wiki.db
      - PORT=3000
    restart: unless-stopped

  quartz-builder:
    build:
      context: .
      dockerfile: Dockerfile.quartz
    volumes:
      - ./content:/home/wiki/content
      - public_data:/home/wiki/public
      - db_data:/home/wiki/server
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SERVER_PORT=3000
    restart: unless-stopped

volumes:
  public_data:
  db_data:
