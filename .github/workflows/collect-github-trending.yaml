name: Collect Daily Knowledge

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/daily_digest/**"
      - "scripts/collect-daily-content.py"
      - "scripts/generate-weekly-report.py"
      - ".github/workflows/collect-github-trending.yaml"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: daily-knowledge
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test daily collectors
        run: python -m unittest discover -s tests/python -p "test_*.py" -v

      - name: Collect daily knowledge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GO_API_KEY: ${{ secrets.GO_API_KEY }}
        run: |
          export RUN_DATE="$(TZ=Asia/Shanghai date +%F)"
          python3 scripts/collect-daily-content.py --content-root content --date "$RUN_DATE" --raw-dir data/daily-cache
          python3 scripts/github_trending.py --period daily --limit 25 --json --output /tmp/trending.json
          node scripts/generate-github-trending.js

      - name: Generate weekly report
        run: |
          export RUN_DATE="$(TZ=Asia/Shanghai date +%F)"
          python3 scripts/generate-weekly-report.py --content-root content --date "$RUN_DATE"

      - name: Commit and push notes
        run: |
          export RUN_DATE="$(TZ=Asia/Shanghai date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content data/daily-cache
          git diff --staged --quiet || git commit -m "docs: daily knowledge $RUN_DATE"
          git push
