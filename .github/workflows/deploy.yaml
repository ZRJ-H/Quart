name: Deploy Quartz to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Collect Daily Knowledge"]
    types: [completed]
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build wiki search index
        run: |
          python3 scripts/build-wiki-index.py content \
            --light-output /tmp/wiki-index-light.json \
            --full-output /tmp/wiki-data-full.json \
            -o /tmp/wiki-data.json

      - name: Build Quartz
        run: npx quartz build --directory content

      - name: Add search suggestions index
        run: cp /tmp/wiki-index-light.json public/wiki-index-light.json

      - name: Prepare Pages artifact
        run: touch public/.nojekyll

      - name: Sync Cloudflare search backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WATCHDOG_GITHUB_TOKEN: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CF_API_TOKEN is not configured; skip Cloudflare KV upload and Worker deploy. Pages deployment will continue."
            exit 0
          fi

          WATCHDOG_SECRET_FILE=""
          trap 'rm -f "$WATCHDOG_SECRET_FILE"' EXIT
          if [ -z "$WATCHDOG_GITHUB_TOKEN" ]; then
            echo "::warning::WATCHDOG_GITHUB_TOKEN is not configured; deploy Worker without updating its GitHub watchdog secret."
          else
            WATCHDOG_SECRET_FILE="$(mktemp)"
            export WATCHDOG_SECRET_FILE
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          secret_file = Path(os.environ["WATCHDOG_SECRET_FILE"])
          secret_file.write_text(
              json.dumps({"GITHUB_TOKEN": os.environ["WATCHDOG_GITHUB_TOKEN"]}),
              encoding="utf-8",
          )
          secret_file.chmod(0o600)
          PY
            if ! npx wrangler secret bulk "$WATCHDOG_SECRET_FILE" --config worker/wrangler.toml; then
              echo "::warning::Failed to sync WATCHDOG_GITHUB_TOKEN; existing Worker secret unchanged. Continue Pages deployment."
            fi
          fi

          cp /tmp/wiki-index-light.json worker/wiki-index-light.json
          cp /tmp/wiki-data-full.json worker/wiki-data-full.json
          cp /tmp/wiki-data.json worker/wiki-data.json
          python3 scripts/upload-to-kv.py worker/wiki-data-full.json
          npx wrangler deploy --config worker/wrangler.toml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
